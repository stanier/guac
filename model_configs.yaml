  # ---------------------------------------------------------------------------
  # Recommended layer mixtures (see docs/LAYER_MIXTURES.md)
  #
  # The presets above have no global attention layer, so nothing in the stack
  # can do exact lookup/copy over the context. These variants keep the same
  # widths but follow mixtures that hold up in published hybrids:
  #   *-hybrid : Jamba / Nemotron-H style. 8-layer block with 1 attention,
  #              4 Mamba-2, 3 conv (conv layers carry the FFN). Attention
  #              is never the first layer.
  #   *-lfm2   : LFM2 style. Short causal convs + ~1/3 GQA attention, fully
  #              parallel (no sequential scan), so the fastest to train.
  # Hyperparameters: bf16 (Mamba's exp() recurrence is fragile in fp16),
  # short warmup, weight decay 0.1, and position table sized to the
  # sequence length instead of the 65536 default.
  # ---------------------------------------------------------------------------
  guac-106m-hybrid:
    step_val: 1
    hidden_size: 512
    num_hidden_layers: 4
    num_attention_heads: 4
    num_kv_heads: 1
    learning_rate: 1e-3
    warmup_ratio: 0.03
    weight_decay: 0.1
    pdbs_train: 32
    pdbs_eval: 32
    grad_accum_steps: 1
    num_train_epochs: 3
    fp16: false
    bf16: true
    architecture: mixed_layer
    layer_types: [
      conv, mamba2, flash_attention, conv,
    ]
    max_sequence_length: 512
    max_position_embeddings: 512
  guac-1.1b-hybrid:
