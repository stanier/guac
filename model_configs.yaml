defaults:
  intermediate_layers_fac: 4
  max_position_embeddings: 65536
  max_sequence_length: 1024  # Default sequence length for tokenization and training
  step_val: 1
  learning_rate: 8e-4
  warmup_ratio: 0.05
  weight_decay: 0.01
  pdbs_train: 16
  pdbs_eval: 16
  grad_accum_steps: 6
  num_train_epochs: 1
  num_experts: 1
  num_experts_per_token: 1
  num_hidden_layers: 1
  use_rms_norm: true
  use_flash_attention: true
  tokenizer_type: sentencepiece
  tokenizer_model_path: scratch/tokenizers/sentencepiece/shared_60k/tokenizer.model
  vocab_size: 60000

common_training_kwargs:
  num_train_epochs: 5
  fp16: true
  max_grad_norm: 1.0
  lr_scheduler_type: constant_with_warmup
  load_best_model_at_end: true
  dataloader_drop_last: true

