# Architecture Configuration for Runtime Model Selection
# This allows dynamic selection of model architectures at runtime

# Available model architectures
architectures:
  llama:
    config_class: "LlamaConfig"
    model_class: "LlamaForCausalLM"
    import_path: "transformers"
    description: "Standard Llama architecture"

  qwen2:
    config_class: "Qwen2Config"
    model_class: "Qwen2ForCausalLM"
    import_path: "transformers"
    description: "Qwen2 architecture"

  lfm2_moe:
    config_class: "Lfm2MoeConfig"
    model_class: "Lfm2MoeForCausalLM"
    import_path: "transformers"
    description: "LFM2 Mixture of Experts architecture"

  lfm2:
    config_class: "Lfm2Config"
    model_class: "Lfm2ForCausalLM"
    import_path: "transformers"
    description: "LFM2 architecture"

  granite:
    config_class: "GraniteConfig"
    model_class: "GraniteForCausalLM"
    import_path: "transformers"
    description: "Granite architecture"

  granite_moe:
    config_class: "GraniteMoeConfig"
    model_class: "GraniteMoeForCausalLM"
    import_path: "transformers"
    description: "Granite Mixture of Experts architecture"

  granite_moe_hybrid:
    config_class: "GraniteMoeHybridConfig"
    model_class: "GraniteMoeHybridForCausalLM"
    import_path: "transformers"
    description: "Granite Mixture of Experts Hybrid architecture"

  granite_moe_shared:
    config_class: "GraniteMoeSharedConfig"
    model_class: "GraniteMoeSharedForCausalLM"
    import_path: "transformers"
    description: "Granite Mixture of Experts Shared architecture"

  basic_transformer:
    config_class: "BasicTransformerConfig"
    model_class: "BasicTransformerForCausalLM"
    import_path: "scripts.training.custom_architectures"
    description: "Basic custom Transformer architecture for educational purposes"

  mixed_layer:
    config_class: "MixedLayerConfig"
    model_class: "MixedLayerForCausalLM"
    import_path: "scripts.training.custom_architectures"
    description: "Mixed layer architecture supporting heterogeneous layer types like Granite and LFM2"

# Default architecture to use
default_architecture: "mixed_layer"

# Architecture-specific default parameters
architecture_defaults:
  llama:
    initializer_range: 0.02
    layer_norm_epsilon: 1e-5
    rms_norm_eps: 1e-6
    use_cache: false

  qwen2:
    initializer_range: 0.02
    layer_norm_epsilon: 1e-6
    use_cache: false

  lfm2_moe:
    initializer_range: 0.01
    layer_norm_epsilon: 1e-6
    use_cache: false

  lfm2:
    initializer_range: 0.01
    layer_norm_epsilon: 1e-6
    use_cache: false

  granite:
    initializer_range: 0.02
    layer_norm_epsilon: 1e-5
    use_cache: false

  granite_moe:
    initializer_range: 0.02
    layer_norm_epsilon: 1e-5
    use_cache: false

  granite_moe_hybrid:
    initializer_range: 0.02
    layer_norm_epsilon: 1e-5
    use_cache: false

  granite_moe_shared:
    initializer_range: 0.02
    layer_norm_epsilon: 1e-5
    use_cache: false

  basic_transformer:
    hidden_size: 512
    num_hidden_layers: 6
    num_attention_heads: 8
    intermediate_size: 2048
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1
    max_position_embeddings: 1024
    layer_norm_eps: 1e-12
    initializer_range: 0.02
    use_cache: false

  mixed_layer:
    hidden_size: 512
    num_hidden_layers: 8
    num_attention_heads: 8
    num_kv_heads: 4
    intermediate_size: 1024
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1
    max_position_embeddings: 2048
    layer_norm_eps: 1e-6
    initializer_range: 0.02
    use_cache: false
    conv_kernel_size: 3
    conv_groups: 1
    # Mamba-2 parameters (optimized for small model)
    mamba_d_state: 8
    mamba_d_conv: 3
    mamba_expand: 1.5
    # BASED parameters (optimized for small model)
    based_feature_dim: 8
    based_num_key_value_heads: 4
    based_num_heads: 8
    # Flash Attention parameters
    flash_attn_causal: true
    flash_attn_softmax_scale: null
    # Stable mixed layer progression (fixed numerical issues)
    layer_types: [
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
      "conv",
    ]

# Runtime architecture selection
# This can be overridden by environment variables or command line args
runtime_config:
  # Architecture to use for current run
  selected_architecture: "mixed_layer"

  # Override architecture-specific parameters
  override_params:
    # Example: force specific attention implementation
    # attn_implementation: "flash_attention_2"
    pass