# vocab_spec.laptop.yaml
#
# Minimal tokenizer configuration for end-to-end laptop/smoke testing.
# Designed for fast CPU training:
#   - Small 8K vocab
#   - No domain partitions (skip Stage 2 entirely)
#   - Only wikitext-103 as training data (available, manageable size)
#
# Run manually:
#   python -m guac.tokenizer.pipeline --spec vocab_spec.laptop.yaml
#   python -m guac.tokenizer.pipeline --spec vocab_spec.laptop.yaml --status
#
# Then point a preset's tokenizer_model_path (or pretrain.py --tokenizer) at
# scratch/tokenizers/laptop/final/hf.

vocab_spec:
  # byte_fallback: false — disables the 256 auto-generated byte tokens.
  # With byte_fallback=True those 256 slots dominate small vocabularies and
  # exhaust the training data capacity before real BPE learning can happen.
  # Turning it off lets the full vocab budget go to BPE merges.
  # wikitext-103 (103M tokens of Wikipedia) comfortably supports 16K+ BPE
  # tokens without byte fallback.
  # No partitions, so Stage 3 only appends the next merges learned from the
  # same corpus; total_size = core_size + 50 just exercises that path.
  byte_fallback: false
  total_size: 8050
  core_size: 8000
  output_dir: scratch/tokenizers/laptop

  # No anchor tokens file for the smoke test
  # anchors:
  #   path: tokens/predefined_anchors.txt

  # No partitions — skip Stage 2 entirely for speed
  # partitions: []

  final_training:
    data:
      - wikitext-103

  deduplication:
    strategy: coverage
    min_coverage: 1
