# vocab_spec.laptop.yaml
#
# Minimal tokenizer configuration for end-to-end laptop/smoke testing.
# Designed for fast CPU training:
#   - Small 4K vocab (matches smoke model config's vocab_size)
#   - No domain partitions (skip Stage 2 entirely)
#   - Only wikitext-103 as training data (available, manageable size)
#
# Run manually:
#   python -m guac.tokenizer.pipeline --spec vocab_spec.laptop.yaml
#   python -m guac.tokenizer.pipeline --spec vocab_spec.laptop.yaml --status
#
# Or just run `make pretrain CONFIG=smoke` — train_tokenizer.py will call
# VocabPipeline automatically when it sees vocab_spec_path in the config.

vocab_spec:
  # byte_fallback: false — disables the 256 auto-generated byte tokens.
  # With byte_fallback=True those 256 slots dominate small vocabularies and
  # exhaust the training data capacity before real BPE learning can happen.
  # Turning it off lets the full vocab budget go to BPE merges.
  # wikitext-103 (103M tokens of Wikipedia) comfortably supports 16K+ BPE
  # tokens without byte fallback.
  # DESIGN NOTE: VocabPipeline is designed for the multi-corpus case.
  # Stage 1 learns the most common BPE tokens from the corpus; Stage 3 gets
  # those as user_defined_symbols and asks the *same* corpus for more.
  # On a single corpus (no partitions), Stage 1 saturates the vocabulary —
  # only ~30 tokens remain for Stage 3.  So we set total_size = core_size + 50
  # to give Stage 3 just enough room to exercise the code path.
  #
  # For a model you actually want to train, use the inline tokenizer instead:
  # remove vocab_spec_path from the smoke config and set tokenizer_model_path.
  # VocabPipeline shines when you add domain partitions with different datasets.
  byte_fallback: false
  total_size: 8010
  core_size: 8000
  output_dir: scratch/tokenizers/laptop

  # No anchor tokens file for the smoke test
  # anchors:
  #   path: tokens/predefined_anchors.txt

  # No partitions — skip Stage 2 entirely for speed
  # partitions: []

  final_training:
    data:
      - wikitext-103

  deduplication:
    strategy: coverage
    min_coverage: 1
