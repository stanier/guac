# vocab_spec.example.yaml
#
# Configuration for the hierarchical tokenizer pipeline.
#
# Three-stage build:
#   Stage 1 (core):       Generalist tokenizer seeded with the prompt template
#                         tokens and anchor tokens. Uses final_training.data.
#   Stage 2 (partitions): One trainer per domain. The pieces each learns that
#                         the core lacks are kept, up to its budget.
#   Stage 3 (final):      The core model with the partition tokens appended, then
#                         pieces learned from final_training.data up to total_size.
#                         Core tokens keep their ids.
#
# Run:
#   python -m guac.tokenizer.pipeline --spec vocab_spec.yaml
#   python -m guac.tokenizer.pipeline --spec vocab_spec.yaml --status
#   python -m guac.tokenizer.pipeline --spec vocab_spec.yaml --force

vocab_spec:

  # Total vocabulary size of the final tokenizer.
  # Note: SentencePiece reserves 4 IDs for special tokens (pad=0, bos=1, eos=2, unk=3).
  # The remaining total_size - 4 slots are split between user_defined_symbols and learned tokens.
  total_size: 131072   # 128K

  # Vocabulary size for the Stage 1 core tokenizer.
  # Should be large enough to give good generalist coverage but small enough
  # that domain partitions still have meaningful budget to contribute.
  core_size: 16384     # 16K

  # Root directory for all trained artifacts.
  # Subdirectories: core/, partitions/<name>/, final/, final/hf/
  output_dir: scratch/tokenizers/partitioned/v1

  # Predefined anchor tokens that are guaranteed to appear in every stage.
  # File format: one token per line; lines starting with '#' are comments.
  # Examples: Unicode block coverage, math/code symbols, structural markers.
  # Leave out the 'anchors' key entirely if you have no predefined tokens.
  anchors:
    path: tokens/predefined_anchors.txt

  # Domain partition trainers (Stage 2).
  # Each partition trains its own tokenizer and contributes up to 'budget' of
  # the pieces it learns that the core lacks.
  # trainer_data names are passed to load_pretraining_datasets() — use known
  # names ('wikitext-103', 'openwebtext'), saved datasets or data files (.jsonl, ...).
  partitions:
    - name: code
      trainer_data:
        - scratch/datasets/downloaded/code_corpus
      budget: 8192

    - name: math
      trainer_data:
        - scratch/datasets/downloaded/arxiv
        - scratch/datasets/downloaded/math_stack
      budget: 8192

    - name: prose
      trainer_data:
        - fineweb-edu
      budget: 8192

  # Datasets used for Stage 1 (core) and Stage 3 (final) training.
  # Should be broad, representative text.
  final_training:
    data:
      - wikitext-103
      - openwebtext

  # Deduplication strategy for Stage 2 partition tokens.
  # strategy: 'coverage'   — keep token only if it appears in >= min_coverage
  #                          partition trainer outputs (cross-domain tokens)
  #           'first-wins' — assign each token to whichever partition first produced it
  # min_coverage is only used with strategy: coverage.
  deduplication:
    strategy: coverage
    min_coverage: 1    # 1 = keep all tokens; 2 = keep only cross-domain tokens
