[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guac"
version = "0.1.0"
description = "Research framework for heterogeneous (mixed-layer) transformer architectures"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "transformers==4.46.3",
    "datasets",
    "tokenizers",
    "sentencepiece",
    "pyyaml",
    "jinja2",
    "tqdm",
    "psutil",
]

[project.optional-dependencies]
test = ["pytest"]
# report_to: wandb
tracking = ["wandb"]
# Mamba-2's fused scan kernel (mamba_scan_impl: mamba_ssm); needs CUDA and a compiler
kernels = ["mamba-ssm"]
# Standalone data scripts in scripts/datasets/
tools = ["numpy", "pandas", "numba"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["guac*"]
