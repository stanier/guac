[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guac"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "transformers==4.46.3",
    "datasets",
    "tokenizers",
    "sentencepiece",
    "pyyaml",
    "jinja2",
    "numpy",
    "pandas",
    "numba",
    "tqdm",
    "psutil",
    "wandb",
    "peft",
    "trl>=0.12,<0.13",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
